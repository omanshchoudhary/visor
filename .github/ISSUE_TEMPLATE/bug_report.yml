name: Bug report
description: Something behaves differently from what you expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security problems, do not use this form. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Start the stack with docker compose up
        2. POST to /api/...
        3. The response is 500 instead of 201
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The commit SHA or tag you are running.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node 26.3.1, pnpm 12.4.1, Docker 28, Linux
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output. Remove anything secret before pasting.
      render: shell
