name: visor

services:
  postgres:
    image: postgres:18
    # Local development only. Do not use these credentials in production.
    environment:
      POSTGRES_USER: visor
      POSTGRES_PASSWORD: visor
      POSTGRES_DB: visor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visor -d visor"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  mailpit:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:8025:8025" # inbox web page
      - "127.0.0.1:1025:1025" # SMTP server

volumes:
  pgdata: