name: visor

services:
  postgres:
    image: postgres:18
    # Local development only. Do not use these credentials in production.
    environment:
      POSTGRES_USER: visor
      POSTGRES_PASSWORD: visor
      POSTGRES_DB: visor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visor -d visor"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.1
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "127.0.0.1:8025:8025" # inbox web page
      - "127.0.0.1:1025:1025" # SMTP server

  server:
    build:
      context: .
      target: server
    init: true
    environment:
      DATABASE_URL: postgresql://visor:visor@postgres:5432/visor
      PORT: 3000
      AUTH_SECRET: dev-only-secret-never-use-in-production
      APP_URL: http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
